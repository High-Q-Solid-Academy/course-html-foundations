<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High Q Academy - Registration</title>
</head>
<body>
  <h1>Student Admission Form</h1>
  <form action="#" method="POST">
    <div>
      <label for="fullname">Full Name</label>
      <input id="fullname" name="fullname" type="text" required>
    </div>
    <div>
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div>
      <label for="course">Select Track</label>
      <select id="course" name="course">
        <option value="git">Git &amp; GitHub</option>
        <option value="html">HTML5 Foundations</option>
        <option value="css">CSS Mastery</option>
        <option value="js">JavaScript Core</option>
      </select>
    </div>
    <div>
      <label for="comments">Comments</label>
      <textarea id="comments" name="comments"></textarea>
    </div>
    <button type="submit">Enroll Now</button>
  </form>
</body>
</html>
